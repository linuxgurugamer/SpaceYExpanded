// Waterfall configs

// Tested, effects need adjustment
@PART[syx-eng-375-P1]:NEEDS[Waterfall]:AFTER[SpaceY]
{
	!EFFECTS {}
	EFFECTS
	{
		running_closed
		{
			AUDIO
			{
				channel = Ship
				clip = sound_rocket_hard
				volume = 0.0 0.0
				volume = 1.0 1.0
				pitch = 0.0 0.2
				pitch = 1.0 0.9
				loop = true
			}
		}
		engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1.0
				pitch = 1.5
				loop = false
			}
		}
		flameout
		{
			PREFAB_PARTICLE
			{
				prefabName = fx_exhaustSparks_flameout_2
				transformName = fxTransform
				oneShot = true
			}
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1.0
				pitch = 1.5
				loop = false
			}
		}
	}

	MODULE
	{
		name = ModuleWaterfallFX

		moduleID = myEngineFX

		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
		}

		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}

		TEMPLATE:NEEDS[CryoEngines]
		{
			templateName = waterfall-hydrolox-lower-3
			overrideParentTransform = fxTransform
			position = 0,0,-0.3
			rotation = 0,0,0
			scale = 1,1,1
		}
		TEMPLATE:NEEDS[!CryoEngines]
		{
			templateName = waterfall-kerolox-lower-3
			overrideParentTransform = fxTransform
			position = 0,0,-0.3
			rotation = 0,0,0
			scale = 1,1,1
		}
	}
}
